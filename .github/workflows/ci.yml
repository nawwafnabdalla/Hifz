name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Part-by-part learning is in the build, and nothing that must stay out of production is
        run: node scripts/check-release-contract.mjs
      - name: Every page chunk is available offline (precached)
        run: node scripts/check-precache.mjs
